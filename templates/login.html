{% extends "base.html" %}

{% block title %} COMIF - Login {% endblock title %}


{% block conteudo %}
<form class="completo form" method="post" action="/login">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required>

    <div class="botoes">
        <button type="submit" class="btn salvar">Entrar</button>
        <a href="/login-aluno" class="btn aluno">Sou Aluno</a>
    </div>
</form>
{% endblock conteudo %}
